<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drift: 30/60/90-Day Challenge</title>
  <meta name="description" content="Turn your 30, 60 or 90-day goals into a daily plan with AI, then track it and see how missed days push your goals back.">
  <meta name="theme-color" content="#1f3a5f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f3a5f'/%3E%3Cpath d='M14 44 L28 30 L36 38 L50 20' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Drift home">
      <span class="brand-mark">↗</span>
      <span class="brand-text">Drift</span>
    </a>
    <div class="topbar-right">
      <span class="sync-dot" id="sync" hidden title="All changes saved"></span>
      <span class="day-pill" id="day-pill" hidden></span>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">☾</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Main" hidden>
    <a href="#/today" data-route="today">Today</a>
    <a href="#/dashboard" data-route="dashboard">Drift</a>
    <a href="#/goals" data-route="goals">Big Goals</a>
    <a href="#/plan" data-route="plan">Days</a>
    <a href="#/jobs" data-route="jobs">Applications</a>
    <a href="#/practice" data-route="practice">Practice</a>
    <a href="#/focus" data-route="focus">Focus</a>
    <a href="#/settings" data-route="settings">Settings</a>
  </nav>

  <main id="app" class="container" tabindex="-1">
    <p class="muted">Loading…</p>
  </main>

  <footer class="footer">
    <span>Never zero. Never double up. Progress, not perfection.</span>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
